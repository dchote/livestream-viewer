# Native 8wi-supervisor manifest (schema_version 1).
# Home Assistant still reads config.yaml; 8wi prefers this file in the same directory.
# privileged is a bool here (Docker Privileged). HA config.yaml uses a capability list.
schema_version: 1
name: livestream-viewer
description: Native hardware-accelerated livestream viewer and video wall. REST API and web UI for management.
version: "0.1.0"
slug: livestream-viewer
url: "https://github.com/dchote/livestream-viewer/tree/main/addon"
icon: mdi-monitor-multiple
arch:
  - aarch64
  - amd64
image: "ghcr.io/dchote/{arch}-addon-livestream-viewer"
init: false
startup: application
boot: auto
ingress:
  enabled: true
  port: 8099
  entry: /
  container_name: livestream-viewer
privileged: true
gpu: true
devices:
  - /dev/dri
map:
  - addon_config:rw
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Management UI and REST API (also used by ingress).
options:
  http_port: 8099
  log_level: info
  display_enabled: true
schema:
  http_port: int
  log_level: list(debug|info|warn|error)
  display_enabled: bool
navigation:
  - title: Preview
    icon: mdi-monitor
    path: /
