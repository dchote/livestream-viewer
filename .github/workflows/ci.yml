name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install FFmpeg 8
        run: |
          brew install ffmpeg@8 pkg-config
          prefix="$(brew --prefix ffmpeg@8)"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${prefix}/lib" >> "$GITHUB_ENV"
          echo "${prefix}/bin" >> "$GITHUB_PATH"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './frontend/node_modules/*'))
          if [ -n "$unformatted" ]; then echo "gofmt needed for:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: CGO_ENABLED=1 go vet ./cmd/... ./internal/... ./api/...

      - name: Test
        run: CGO_ENABLED=1 go test -timeout=30s ./cmd/... ./internal/... ./api/...

      - name: Race (frame, display, schedule)
        run: CGO_ENABLED=1 go test -race -timeout=60s ./internal/frame/... ./internal/display/... ./internal/schedule/...

      - name: Frontend
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn lint
          yarn build

      - name: Build with embedded frontend
        run: ./scripts/build.sh
