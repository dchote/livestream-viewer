name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './frontend/node_modules/*'))
          if [ -n "$unformatted" ]; then echo "gofmt needed for:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./api/...

      - name: Test
        run: CGO_ENABLED=1 go test -race -timeout=60s ./cmd/... ./internal/... ./api/...

      - name: Frontend
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn lint
          yarn build

      - name: Build with embedded frontend
        run: ./scripts/build.sh
